name: Security Scanning

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight (run container rebuild/scan daily)
  workflow_dispatch:
  pull_request:
    branches:
      - '**'
  push:
    branches-ignore: [ main ]
    paths:
      - pyproject.toml
      - '**/*.py'
      - 'Dockerfile'

jobs:
  check-open-pr:
    name: Check for open pull request
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.open-pr.outputs.should-run }}
    permissions:
      pull-requests: read
    steps:
      - id: open-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          open_pr_count=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f "head=${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
            -f per_page=1 \
            --jq 'length')
          if [ "$open_pr_count" -gt 0 ]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  codeql-analysis:
    name: CodeQL Security Analysis
    needs: check-open-pr
    if: ${{ needs.check-open-pr.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: "/language:${{matrix.language}}"

  container-scan:
    # GitHub does not provide repository secrets to Dependabot-triggered workflows.
    needs: check-open-pr
    if: ${{ needs.check-open-pr.outputs.should-run == 'true' && github.actor != 'dependabot[bot]' }}
    name: Container Scan (Snyk)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build Docker image for scanning
        run: docker build -t external-dns-technitium-webhook:${{ github.sha }} .

      - name: Run Snyk container scan (SARIF)
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: external-dns-technitium-webhook:${{ github.sha }}
          command: test
          args: --sarif-file-output=snyk-container.sarif --json-file-output=snyk-container.json --severity-threshold=low

      - name: Upload Snyk container SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        if: always()
        with:
          sarif_file: snyk-container.sarif

      - name: Upload Snyk JSON results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: snyk-container-json
          path: snyk-container.json
          retention-days: 90

      - name: Generate Snyk container summary
        if: always()
        run: |
          echo "### Snyk Container Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ! -f snyk-container.json ]; then echo "No Snyk JSON output found" >> $GITHUB_STEP_SUMMARY; exit 0; fi
          CRITICAL=$(jq '[.. | .vulnerabilities? // [] | .[]? | select((.severity // "") | ascii_downcase=="critical")] | length' snyk-container.json)
          HIGH=$(jq '[.. | .vulnerabilities? // [] | .[]? | select((.severity // "") | ascii_downcase=="high")] | length' snyk-container.json)
          MEDIUM=$(jq '[.. | .vulnerabilities? // [] | .[]? | select((.severity // "") | ascii_downcase=="medium")] | length' snyk-container.json)
          LOW=$(jq '[.. | .vulnerabilities? // [] | .[]? | select((.severity // "") | ascii_downcase=="low")] | length' snyk-container.json)
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 Low | $LOW |" >> $GITHUB_STEP_SUMMARY

      # Trivy artifact step removed; Snyk JSON is uploaded earlier as 'snyk-container-json'

  dependency-scan:
    name: Dependency Security Scan
    needs: check-open-pr
    if: ${{ needs.check-open-pr.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run pip-audit for CVE scanning
        run: |
          pip install pip-audit
          pip-audit --desc --format json --output pip-audit-report.json || true
          pip-audit --desc --format markdown --output pip-audit-report.md || true

      - name: Upload pip-audit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pip-audit-report
          path: |
            pip-audit-report.json
            pip-audit-report.md
          retention-days: 90

      - name: Display pip-audit summary
        if: always()
        run: |
          if [ -f pip-audit-report.md ]; then
            echo "### pip-audit CVE Scan Results" >> $GITHUB_STEP_SUMMARY
            cat pip-audit-report.md >> $GITHUB_STEP_SUMMARY
          fi

  code-scan:
    name: Code Security Analysis
    needs: check-open-pr
    if: ${{ needs.check-open-pr.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install a pinned Bandit version and Semgrep. Use the same Bandit
          # version we validate locally (compatible with Python 3.14).
          pip install 'bandit[toml]==1.8.6' semgrep

      - name: Run Bandit security linter
        run: |
          bandit -r external_dns_technitium_webhook -f json -o bandit-report.json || true
          bandit -r external_dns_technitium_webhook -f txt -o bandit-report.txt || true

      - name: Upload Bandit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bandit-report
          path: |
            bandit-report.json
            bandit-report.txt
          retention-days: 90

      - name: Run Semgrep security scan
        run: |
          semgrep --config=auto --json --output=semgrep-report.json external_dns_technitium_webhook/ || true

      - name: Upload Semgrep results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 90

  snyk-security:
    # GitHub does not provide repository secrets to Dependabot-triggered workflows.
    needs: check-open-pr
    if: ${{ needs.check-open-pr.outputs.should-run == 'true' && github.actor != 'dependabot[bot]' }}
    name: Snyk Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium --sarif-file-output=snyk-code.sarif

      - name: Upload Snyk results to GitHub Security
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        if: always()
        with:
          sarif_file: snyk-code.sarif

      - name: Run Snyk monitor (track over time)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snyk/actions/python@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --project-name=${{ github.repository }}

      # Container scanning with Snyk
      - name: Build Docker image for Snyk container scan
        run: docker build -t external-dns-technitium-webhook:${{ github.sha }} .

      - name: Run Snyk Container Scan (SARIF)
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: external-dns-technitium-webhook:${{ github.sha }}
          args: --severity-threshold=high --sarif-file-output=snyk-container.sarif

      - name: Upload Snyk container SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        if: always()
        with:
          sarif_file: snyk-container.sarif

      - name: Set up Node.js for Snyk CLI
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '18'

      - name: Install Snyk CLI
        run: npm install -g snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk container test (JSON)
        id: snyk-json
        run: |
          # run test and write JSON output; allow non-zero exit so we can inspect results
          snyk container test external-dns-technitium-webhook:${{ github.sha }} --json > snyk-container.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk JSON results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snyk-container-json
          path: snyk-container.json

      - name: Fail on HIGH or CRITICAL Snyk vulnerabilities
        run: |
          if [ ! -f snyk-container.json ]; then echo "snyk-container.json not found"; exit 0; fi
          HIGH_COUNT=$(jq '[.vulnerabilities[]? | select(.severity=="high" or .severity=="critical")] | length' snyk-container.json)
          echo "Found $HIGH_COUNT high/critical Snyk vulnerabilities"
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "Failing because high/critical vulnerabilities found by Snyk"
            exit 1
          fi

      - name: Run Snyk container monitor (track over time)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: external-dns-technitium-webhook:${{ github.sha }}
          command: monitor
          args: --project-name=${{ github.repository }}-container

  sbom-generation:
    name: SBOM Generation and Analysis
    needs: check-open-pr
    if: ${{ needs.check-open-pr.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build Docker image
        run: docker build -t external-dns-technitium-webhook:${{ github.sha }} .

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: external-dns-technitium-webhook:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Generate SBOM in CycloneDX format
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: external-dns-technitium-webhook:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-reports
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
          retention-days: 90

      - name: Scan SBOM with Grype
# Scope: This annotation applies only to the Anchore scan-action `uses:` line.
# Rationale: Latest v7.4.0 SHA pin and reversible v7.3.2 test isolates rule issue.
# Expires/review: 2026-08-18
# Compensating control: verified immutable 40-character SHA pin
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2c # v7.4.0  # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        id: grype
        with:
          sbom: sbom.spdx.json
          fail-build: false
          severity-cutoff: high

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        if: always()
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}

  security-summary:
    name: Security Summary Report
    runs-on: ubuntu-latest
    needs: [check-open-pr, container-scan, dependency-scan, code-scan, sbom-generation]
    if: ${{ always() && needs.check-open-pr.outputs.should-run == 'true' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Generate security summary
        run: |
          echo "### 🔒 Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All security scans have completed. Check the Security tab for detailed results." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scans performed:**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Container vulnerability scan (Snyk)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency CVE check (pip-audit)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code security analysis (Bandit, Semgrep)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Snyk vulnerability detection" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SBOM generation and analysis" >> $GITHUB_STEP_SUMMARY
