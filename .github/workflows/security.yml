name: Security Scanning

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight (run container rebuild/scan daily)
  workflow_dispatch:
  pull_request:
    branches:
      - '**'
  push:
    branches-ignore: [ main ]
    paths:
      - pyproject.toml
      - pylock.toml
      - '**/*.py'
      - 'Dockerfile'

jobs:
  check-open-pr:
    name: Check for open pull request
    runs-on: ubuntu-26.04
    outputs:
      should-run: ${{ steps.open-pr.outputs.should-run }}
    permissions:
      pull-requests: read
    steps:
      - id: open-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          open_pr_count=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f "head=${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
            -f per_page=1 \
            --jq 'length')
          if [ "$open_pr_count" -gt 0 ]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  codeql-analysis:
    name: CodeQL Security Analysis
    needs: check-open-pr
    if: ${{ needs.check-open-pr.outputs.should-run == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: '.[dev]'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{matrix.language}}"

  container-scan:
    # GitHub does not provide repository secrets to Dependabot-triggered workflows.
    needs: check-open-pr
    if: ${{ needs.check-open-pr.outputs.should-run == 'true' && github.actor != 'dependabot[bot]' }}
    name: Container Scan (Snyk)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The base image lives in Docker's Hardened Images registry, which
      # requires a login to pull. Read-only Docker Hub credentials are
      # sufficient (pull scope only).
      - name: Log in to Docker Hardened Images registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_HUB_RO_USER }}
          password: ${{ secrets.DOCKER_HUB_RO_PAT }}

      - name: Build Docker image for scanning
        run: docker build -t external-dns-technitium-webhook:${{ github.sha }} .

      - name: Run Snyk container scan (SARIF)
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: external-dns-technitium-webhook:${{ github.sha }}
          command: test
          args: --sarif-file-output=snyk-container.sarif --json-file-output=snyk-container.json --severity-threshold=low

      - name: Normalize Snyk container SARIF
        if: always()
        run: |
          if [ -f snyk-container.sarif ]; then
            if jq 'walk(if type == "object" then with_entries(select(.key != "security-severity" or .value != null)) else . end)' \
                snyk-container.sarif > snyk-container.normalized.sarif; then
              mv snyk-container.normalized.sarif snyk-container.sarif
            else
              echo "Snyk SARIF normalization failed; preserving the original report"
              rm -f snyk-container.normalized.sarif
            fi
          fi

      - name: Upload Snyk container SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        continue-on-error: true
        with:
          sarif_file: snyk-container.sarif

      - name: Upload Snyk JSON results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: snyk-container-json
          path: snyk-container.json
          retention-days: 90

      - name: Generate Snyk container summary
        if: always()
        run: |
          echo "### Snyk Container Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ! -f snyk-container.json ]; then echo "No Snyk JSON output found" >> $GITHUB_STEP_SUMMARY; exit 0; fi
          SEV='(((.severity // "") | ascii_downcase) == "high") or (((.severity // "") | ascii_downcase) == "critical")'
          FIX='(((.fixInfo.name // "") != "") or ((.fixInfo.version // "") != "") or (((.fixedIn // []) | length) > 0) or (((.patches // []) | length) > 0) or (.isPatchable // false) or (.isUpgradable // false))'
          CRITICAL=$(jq '[.. | .vulnerabilities? // [] | .[]? | select((.severity // "") | ascii_downcase=="critical")] | unique_by(.id) | length' snyk-container.json)
          HIGH=$(jq '[.. | .vulnerabilities? // [] | .[]? | select((.severity // "") | ascii_downcase=="high")] | unique_by(.id) | length' snyk-container.json)
          MEDIUM=$(jq '[.. | .vulnerabilities? // [] | .[]? | select((.severity // "") | ascii_downcase=="medium")] | unique_by(.id) | length' snyk-container.json)
          LOW=$(jq '[.. | .vulnerabilities? // [] | .[]? | select((.severity // "") | ascii_downcase=="low")] | unique_by(.id) | length' snyk-container.json)
          BLOCKING=$(jq "[.. | .vulnerabilities? // [] | .[]? | select(($SEV) and ($FIX))] | unique_by(.id) | length" snyk-container.json)
          BYPASS=$(jq "[.. | .vulnerabilities? // [] | .[]? | select(($SEV) and (($FIX) | not))] | unique_by(.id) | length" snyk-container.json)
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 Low | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Gate:** $BLOCKING high/critical finding(s) block (a published fix exists) · $BYPASS high/critical finding(s) have no published fix yet (not blocking)." >> $GITHUB_STEP_SUMMARY
          BYPASS_LIST=$(jq -r "[.. | .vulnerabilities? // [] | .[]? | select(($SEV) and ((($FIX) | not))) ] | unique_by(.id) | .[] | .id + \" \" + (.packageName // \"?\") + \" \" + (.version // \"?\")" snyk-container.json)
          if [ -n "$BYPASS_LIST" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "High/critical findings with no published fix (bypassed — listed so the CVEs stay visible until a fix ships):" >> $GITHUB_STEP_SUMMARY
            printf '%s\n' "$BYPASS_LIST" | while IFS= read -r line; do
              [ -n "$line" ] && echo "- \`$line\`" >> $GITHUB_STEP_SUMMARY
            done
          fi

      - name: Enforce Snyk container vulnerability gate
        if: always()
        run: |
          # Gate policy: block a high/critical finding only when a published fix
          # exists for the affected package. A high/critical finding with no
          # published fix version (Debian has not shipped it yet) is reported but
          # does not block, because there is no version this build can move to;
          # the instant Snyk reports a fixed version it becomes blocking again.
          if [ ! -s snyk-container.json ]; then
            echo "Snyk did not produce a readable JSON report"
            exit 1
          fi
          SEV='(((.severity // "") | ascii_downcase) == "high") or (((.severity // "") | ascii_downcase) == "critical")'
          FIX='(((.fixInfo.name // "") != "") or ((.fixInfo.version // "") != "") or (((.fixedIn // []) | length) > 0) or (((.patches // []) | length) > 0) or (.isPatchable // false) or (.isUpgradable // false))'
          BLOCKING=$(jq "[.. | .vulnerabilities? // [] | .[]? | select(($SEV) and ($FIX))] | unique_by(.id) | length" snyk-container.json)
          if [ "$BLOCKING" -gt 0 ]; then
            echo "Failing because Snyk found $BLOCKING high/critical vulnerabilities WITH a published fix:"
            jq -r "[.. | .vulnerabilities? // [] | .[]? | select((($SEV) and ($FIX)))] | unique_by(.id) | .[] | .id + \" \" + (.packageName // \"?\") + \" \" + (.version // \"?\")" snyk-container.json
            exit 1
          fi
          echo "No blocking high/critical findings (every high/critical finding has no published fix yet; see the summary for the bypassed list)."

      # Trivy artifact step removed; Snyk JSON is uploaded earlier as 'snyk-container-json'

  dependency-scan:
    name: Dependency Security Scan
    needs: check-open-pr
    if: ${{ needs.check-open-pr.outputs.should-run == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: .

      - name: Run pip-audit for CVE scanning
        run: |
          pip install pip-audit
          pip-audit --desc --format json --output pip-audit-report.json || true
          pip-audit --desc --format markdown --output pip-audit-report.md || true

      - name: Upload pip-audit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pip-audit-report
          path: |
            pip-audit-report.json
            pip-audit-report.md
          retention-days: 90

      - name: Display pip-audit summary
        if: always()
        run: |
          if [ -f pip-audit-report.md ]; then
            echo "### pip-audit CVE Scan Results" >> $GITHUB_STEP_SUMMARY
            cat pip-audit-report.md >> $GITHUB_STEP_SUMMARY
          fi

  code-scan:
    name: Code Security Analysis
    needs: check-open-pr
    if: ${{ needs.check-open-pr.outputs.should-run == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install a pinned Bandit version and Semgrep. Use the same Bandit
          # version we validate locally (compatible with Python 3.14).
          pip install 'bandit[toml]==1.8.6' 'semgrep==1.180.0'

      - name: Run Bandit security linter
        run: |
          bandit -r external_dns_technitium_webhook -f json -o bandit-report.json || true
          bandit -r external_dns_technitium_webhook -f txt -o bandit-report.txt || true

      - name: Upload Bandit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bandit-report
          path: |
            bandit-report.json
            bandit-report.txt
          retention-days: 90

      - name: Run Semgrep security scan
        run: |
          semgrep --config=auto --json --output=semgrep-report.json external_dns_technitium_webhook/ || true

      - name: Upload Semgrep results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 90

  snyk-security:
    # GitHub does not provide repository secrets to Dependabot-triggered workflows.
    needs: check-open-pr
    if: ${{ needs.check-open-pr.outputs.should-run == 'true' && github.actor != 'dependabot[bot]' }}
    name: Snyk Security Analysis
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: .

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium --sarif-file-output=snyk-code.sarif

      - name: Upload Snyk results to GitHub Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: snyk-code.sarif

      - name: Run Snyk monitor (track over time)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snyk/actions/python@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --project-name=${{ github.repository }}

      # Container scanning with Snyk
      # The base image lives in Docker's Hardened Images registry, which
      # requires a login to pull. Read-only Docker Hub credentials are
      # sufficient (pull scope only).
      - name: Log in to Docker Hardened Images registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_HUB_RO_USER }}
          password: ${{ secrets.DOCKER_HUB_RO_PAT }}

      - name: Build Docker image for Snyk container scan
        run: docker build -t external-dns-technitium-webhook:${{ github.sha }} .

      - name: Run Snyk Container Scan (SARIF)
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: external-dns-technitium-webhook:${{ github.sha }}
          args: --severity-threshold=high --sarif-file-output=snyk-container.sarif

      - name: Normalize Snyk container SARIF
        if: always()
        run: |
          if [ -f snyk-container.sarif ]; then
            if jq 'walk(if type == "object" then with_entries(select(.key != "security-severity" or .value != null)) else . end)' \
                snyk-container.sarif > snyk-container.normalized.sarif; then
              mv snyk-container.normalized.sarif snyk-container.sarif
            else
              echo "Snyk SARIF normalization failed; preserving the original report"
              rm -f snyk-container.normalized.sarif
            fi
          fi

      - name: Upload Snyk container SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        continue-on-error: true
        with:
          sarif_file: snyk-container.sarif

      - name: Set up Node.js for Snyk CLI
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '18'

      - name: Install Snyk CLI
        run: npm install -g snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk container test (JSON)
        id: snyk-json
        run: |
          # run test and write JSON output; allow non-zero exit so we can inspect results
          snyk container test external-dns-technitium-webhook:${{ github.sha }} --json > snyk-container.json || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk JSON results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snyk-container-json
          path: snyk-container.json

      - name: Fail on HIGH or CRITICAL Snyk vulnerabilities
        run: |
          if [ ! -f snyk-container.json ]; then echo "snyk-container.json not found"; exit 0; fi
          # Gate policy (mirrors the container job): block only high/critical
          # findings that have a published fix; unfixable findings stay visible
          # in the SARIF/JSON artifacts and become blocking once a fix ships.
          SEV='(((.severity // "") | ascii_downcase) == "high") or (((.severity // "") | ascii_downcase) == "critical")'
          FIX='(((.fixInfo.name // "") != "") or ((.fixInfo.version // "") != "") or (((.fixedIn // []) | length) > 0) or (((.patches // []) | length) > 0) or (.isPatchable // false) or (.isUpgradable // false))'
          BLOCKING=$(jq "[.. | .vulnerabilities? // [] | .[]? | select(($SEV) and ($FIX))] | unique_by(.id) | length" snyk-container.json)
          echo "Found $BLOCKING blocking (fixable high/critical) Snyk vulnerabilities"
          if [ "$BLOCKING" -gt 0 ]; then
            echo "Failing because Snyk found high/critical vulnerabilities WITH a published fix:"
            jq -r "[.. | .vulnerabilities? // [] | .[]? | select((($SEV) and ($FIX)))] | unique_by(.id) | .[] | .id + \" \" + (.packageName // \"?\") + \" \" + (.version // \"?\")" snyk-container.json
            exit 1
          fi

      - name: Run Snyk container monitor (track over time)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: external-dns-technitium-webhook:${{ github.sha }}
          command: monitor
          args: --project-name=${{ github.repository }}-container

  sbom-generation:
    name: SBOM Generation and Analysis
    needs: check-open-pr
    if: ${{ needs.check-open-pr.outputs.should-run == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The base image lives in Docker's Hardened Images registry, which
      # requires a login to pull. Read-only Docker Hub credentials are
      # sufficient (pull scope only).
      - name: Log in to Docker Hardened Images registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_HUB_RO_USER }}
          password: ${{ secrets.DOCKER_HUB_RO_PAT }}

      - name: Build Docker image
        run: docker build -t external-dns-technitium-webhook:${{ github.sha }} .

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: external-dns-technitium-webhook:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Generate SBOM in CycloneDX format
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: external-dns-technitium-webhook:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-reports
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
          retention-days: 90

      - name: Scan SBOM with Grype
# Scope: This annotation applies only to the Anchore scan-action `uses:` line.
# Rationale: Latest v7.4.2 SHA pin; the rule mistakes an immutable commit for a mutable tag.
# Expires/review: 2026-12-19
# Compensating control: verified immutable 40-character SHA pin
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2  # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        id: grype
        with:
          sbom: sbom.spdx.json
          fail-build: false
          severity-cutoff: high

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}

  security-summary:
    name: Security Summary Report
    runs-on: ubuntu-26.04
    needs: [check-open-pr, container-scan, dependency-scan, code-scan, sbom-generation]
    if: ${{ always() && needs.check-open-pr.outputs.should-run == 'true' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Generate security summary
        run: |
          echo "### 🔒 Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All security scans have completed. Check the Security tab for detailed results." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scans performed:**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Container vulnerability scan (Snyk)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency CVE check (pip-audit)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code security analysis (Bandit, Semgrep)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Snyk vulnerability detection" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SBOM generation and analysis" >> $GITHUB_STEP_SUMMARY
