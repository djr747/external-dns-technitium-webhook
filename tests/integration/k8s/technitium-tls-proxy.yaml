apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: technitium-test-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: technitium-test-ca
spec:
  isCA: true
  commonName: technitium-test-ca
  secretName: technitium-test-ca
  issuerRef:
    name: technitium-test-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: technitium-test-ca
spec:
  ca:
    secretName: technitium-test-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: technitium-tls-proxy
spec:
  secretName: technitium-tls-proxy
  dnsNames:
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: technitium-test-ca
    kind: Issuer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: technitium-tls-proxy-config
  labels:
    app.kubernetes.io/name: technitium-tls-proxy
data:
  default.conf: |
    server {
      listen 8443 ssl;
      ssl_certificate /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      location / {
        proxy_pass http://technitium:5380;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium-tls-proxy
  labels:
    app.kubernetes.io/name: technitium-tls-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: technitium-tls-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: technitium-tls-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.5-alpine
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: technitium-tls-proxy
        - name: config
          configMap:
            name: technitium-tls-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-tls-proxy
  labels:
    app.kubernetes.io/name: technitium-tls-proxy
spec:
  selector:
    app.kubernetes.io/name: technitium-tls-proxy
  ports:
    - name: https
      port: 8443
      targetPort: 8443
