apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: technitium
  template:
    metadata:
      labels:
        app: technitium
    spec:
      automountServiceAccountToken: false
      containers:
      - name: technitium-dns
        image: technitium/dns-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5380
          name: api
        - containerPort: 53443
          name: https
        - containerPort: 53
          name: dns-udp
          protocol: UDP
        - containerPort: 53
          name: dns-tcp
          protocol: TCP
        env:
        - name: DNS_SERVER_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: technitium-secret
              key: password
        - name: DNS_SERVER_WEB_SERVICE_HTTP_PORT
          value: "5380"
        - name: DNS_SERVER_WEB_SERVICE_HTTPS_PORT
          value: "53443"
        - name: DNS_SERVER_WEB_SERVICE_ENABLE_HTTPS
          value: "true"
        - name: DNS_SERVER_WEB_SERVICE_HTTP_TO_TLS_REDIRECT
          value: "false"
        - name: DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PATH
          value: "/etc/technitium/tls/keystore.p12"
        - name: DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: technitium-pkcs12-password
              key: password
        livenessProbe:
          httpGet:
            path: /api/user/login
            port: 5380
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/user/login
            port: 5380
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 2Gi
        volumeMounts:
        - name: technitium-https-tls
          mountPath: /etc/technitium/tls
          readOnly: true
      
      volumes:

      - name: technitium-https-tls
        secret:
          secretName: technitium-https-tls
          items:
          - key: keystore.p12
            path: keystore.p12

---
apiVersion: v1
kind: Service
metadata:
  name: technitium
spec:
  selector:
    app: technitium
  ports:
  - name: api
    port: 5380
    targetPort: 5380
    protocol: TCP
  - name: https
    port: 53443
    targetPort: 53443
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: technitium-external
spec:
  selector:
    app: technitium
  ports:
  - name: api
    port: 5380
    targetPort: 5380
    protocol: TCP
    nodePort: 30380
  type: NodePort
